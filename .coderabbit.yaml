# CodeRabbit review configuration.
#
# path_filters — "!" excludes. These also drive CodeRabbit's sparse-checkout, so
# excluded files are never cloned; CodeRabbit cannot read them as context either.
# Anything in .gitignore (/.dev/, /docs/status/, dist/, .turbo/, node_modules/)
# never reaches a diff, so it needs no entry here.
#
# path_instructions — a targeted supplement to CodeRabbit's built-in review, not a
# replacement. Each block below encodes a convention that lives in AGENTS.md,
# CONTRIBUTING.md, or the template's AGENTS.md and that CodeRabbit has no way to
# infer from the code alone.
reviews:
  path_filters:
    # Manual QA reports are committed back to the PR after the run, as a record of
    # a human test pass. Re-reviewing them adds nothing.
    - "!docs/qa/**"
    # Design docs are written and pressure-tested before implementation; by the time
    # they land in a PR they've already been through a review of their own.
    - "!docs/plans/**"
    # Agent skill definitions and harness config — instructions, not shipped code.
    - "!.agents/**"
    - "!.claude/**"
    # Generated by pnpm; 2k lines of resolved dependency graph, no review value.
    - "!pnpm-lock.yaml"

  path_instructions:
    - path: "packages/cli/src/commands/**"
      instructions: |
        These are the CLI's clack-based command surfaces. Review against `add.ts`,
        which is the reference implementation every other command mirrors.

        - Do NOT request unit tests for files in this directory. By deliberate repo
          convention only `src/lib/` is unit-tested; command behaviour is covered by
          the manual QA plans in `docs/qa/`. There are zero test files here and that
          is intended, not an oversight.
        - Unknown flags must be rejected strictly, before any disk access, with a
          usage line and exit 1.
        - Any command that mutates project state must persist `saasaloy.json`,
          `saasaloy-lock.json`, and `.saasaloy/manifest.json` inside a `try/finally`,
          so a mid-run failure still leaves the ledger reflecting what actually
          happened on disk. Flag a mutation path that can exit without persisting.
        - Error and cancellation UX goes through clack `cancel`/`note`, matching
          `add.ts`. Flag bare `console.log`/`process.exit` in the interactive path.
        - Destructive operations must be previewable via `--dry-run` and `--diff`,
          and both must write nothing.

    - path: "packages/cli/src/lib/**"
      instructions: |
        This is the CLI engine. Pure decision logic is split from execution: a
        `buildXPlan()` that only reads and classifies, and an `executeXPlan()` that
        performs the writes. `applier.ts` and `remover.ts` are deliberate mirrors of
        each other — a change to one usually implies a change to the other.

        - Expect a sibling `*.test.ts` for pure decision logic (plan builders,
          classifiers, resolvers, graph walks). Do NOT demand tests for thin IO or
          presentation wrappers — `logger.ts`, `tui.ts`, `diff.ts`, `fs-utils.ts`,
          `project.ts`, `resolve.ts`, `scaffold.ts`, `schema.ts`, `manifest.ts`, and
          `saasaloy-config.ts` are intentionally untested.
        - Plan builders must stay pure: no writes, no network. The CLI's remove path
          is offline by construction, deriving entirely from the three local state
          files. Flag any descriptor refetch or network call introduced here.
        - Never silently overwrite or delete user-modified ("drifted") content. Drift
          is detected by re-hashing against the manifest and must be surfaced, not
          resolved unilaterally.
        - Directory pruning must stop at the first non-empty ancestor and must never
          walk past the project root.

    - path: "modules/*/registry-item.json"
      instructions: |
        Module descriptors, validated by `packages/cli/schemas/registry-item.schema.json`.

        - Every dependency version must be exact-pinned. Reject `^`, `~`, `*`, `latest`
          or any range in `dependencies`/`devDependencies`. These deps are invisible to
          pnpm, so a range here is never caught by the lockfile.
        - `dependsOn` is the dependency graph `saasaloy remove` reads to refuse removing
          a module others rely on. A missing or wrong entry silently breaks that safety
          check — verify it against what the module's files actually import.
        - Every `path` in `files[]` and `scaffolds[].files[]` must exist under the
          module's `files/` directory, and every `target` must be a workspace-relative
          path, not absolute.
        - `envVars` values are user-facing documentation. Each must say what the variable
          does and what happens when it is unset.
        - Paths listed under `agent.skills` must exist as skill folders in the module.

    - path: "modules/*/files/package.json"
      instructions: |
        These become real workspaces in a scaffolded user project.

        - MUST declare a `clean` script backed by `rimraf`, added as an exact-pinned
          devDependency. Never `rm -rf` — it does not exist on Windows. Pass `-g` when
          any argument is a glob.
        - `clean` deletes only what the workspace generates (`dist`, `.astro`,
          `.wrangler`, `*.tsbuildinfo`). It must NOT delete `node_modules` or `.turbo`
          (the template's root `clean` handles those in one pass), and must never delete
          committed source or generated-then-committed files such as Drizzle migrations.
        - All versions exact-pinned; no ranges.

    - path: "packages/cli/templates/base/**/package.json"
      instructions: |
        The base template scaffolded by `saasaloy init`. Same rules as module workspaces:
        a `clean` script backed by an exact-pinned `rimraf` devDependency, never `rm -rf`,
        cleaning only generated output. Root `clean` is the one place `node_modules` and
        `.turbo` are removed, and it must run `turbo run clean` first so Turborepo has
        finished streaming its task log before `.turbo` is deleted. All versions
        exact-pinned.

    - path: "packages/cli/schemas/*.json"
      instructions: |
        JSON Schemas for the CLI's on-disk state files.

        - Schema changes must stay backward compatible with state files written before
          the change. A newly required field breaks existing projects. New fields should
          be optional and loaded with a default (e.g. an empty array), so a manifest
          written by an older CLI still parses.
        - Keep `schemas/examples/*.example.json` in lockstep with the schema it
          illustrates — a stale example is what people copy from.
        - Match the existing validation depth: require the structural keys, but do not
          deep-validate nested payloads that other schemas already own.

    - path: "packages/cli/templates/base/packages/ui/src/blocks/*.tsx"
      instructions: |
        Marketing blocks consumed from Astro. These rules are not stylistic — each one
        prevents a specific runtime failure.

        - One block, one file, one component export plus its prop types. No second
          component, no default export, no `blocks/index.ts` barrel. Astro gives every
          `client:*` component its own React root, so a compound primitive (accordion,
          dialog, dropdown) split across an `.astro` boundary throws "must be used
          within" at runtime. Keep the whole composition inside the block.
        - Every prop optional, with its default in this file. Scalar copy defaults inline
          in the parameter destructuring; a list or object takes a named `const` at the
          top of the file instead of being wedged into the signature.
        - Never accept a component or a function as a prop — Astro serializes island
          props, so icons and renderers must live inside the block.
        - Semantic kebab-case filenames (`feature-grid.tsx`), never shadcn's registry
          `{category}-{NN}` numbering.
        - Static by default. Flag a client directive on a block with no state; when one
          is genuinely needed prefer `client:idle` above the fold and `client:visible`
          below it, never a blanket `client:load`.
