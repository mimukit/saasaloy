name: infra
runtime: nodejs
description: >-
  Centralized deployment of every Saasaloy service via Pulumi (ADR 0021, Cloudflare-only
  v1). Discovers each service's wrangler.jsonc, translates its bindings into Cloudflare
  resources, and deploys the built Worker.
# DIY backend, state committed in this workspace (ADR 0021) — PR-reviewable, no Pulumi
# Cloud account required. Path is relative to this file, so `state/` lives at
# `infra/state/` regardless of the directory `pulumi` is invoked from. Upgrading to a
# team-scale backend (e.g. R2 over its S3 API) only changes this one line — see the
# saasaloy-infra skill.
backend:
  url: file://./state
