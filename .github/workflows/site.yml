# The public site's gate, for apps/web (plan 0091, Site workflow and Gate tooling rows).
# A pull request that touches the site, the module registry it reads or the wiki it
# links to runs the catalog tests and the build, then checks the built page in a real
# browser: axe in both themes at 375, 768 and 1440 px, and one mobile Lighthouse run that
# must score 95 or more in all four categories. Lint is not here: ci.yml runs `pnpm lint`
# on the whole repo for every pull request that reaches this workflow.
#
# The job also checks for stale docs (plan 0114, Phase 5): it lists each
# hand-written wiki page that covers a file the pull request changes while the pull
# request leaves the page alone. The list goes to the job summary and to one sticky
# comment that each later run updates. It never fails the job. The `docs: none` label
# says the pull request needs no docs change, so the job also runs when a label changes.
#
# This file has no deploy job, no secrets and no push trigger. The production deploy is
# the `after:release` hook in `packages/cli/.release-it.js`, run by the owner (plan 0114,
# Phase 6).
name: site

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # The site's own files, and every path a hand-written page covers (`documents:` in
    # docs/wiki/.wikimap.yaml). `scripts/docs-stale-comment.test.ts` fails when a page
    # covers a path that is not listed here.
    paths:
      - apps/web/**
      - modules/**
      - packages/cli/**
      - .agents/**
      - README.md
      - llms.txt
      - CONTRIBUTING.md
      - scripts/docs-*.ts
      - package.json
      - oxlint.config.mjs
      - docs/wiki/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/site.yml

# A pull request pushed to twice does not need the first run's answer.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    # The sticky comment is the one write this job makes.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Full history: the stale-docs check reads `git log origin/<base>..HEAD`, and the docs
      # banner counts commits since the latest `v*` tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No `version` key: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Never fails the job: a stale page is information. A fork's read-only token cannot
      # write the comment, so the post step may fail too, and the summary still shows.
      - name: Check for stale docs
        continue-on-error: true
        env:
          DOCS_NONE: "${{ contains(github.event.pull_request.labels.*.name, 'docs: none') }}"
          BASE_REF: ${{ github.base_ref }}
        run: |
          pnpm docs:stale --base "origin/$BASE_REF" --json > "$RUNNER_TEMP/stale.json"
          flag=""
          if [ "$DOCS_NONE" = "true" ]; then flag="--docs-none"; fi
          node scripts/docs-stale-comment.ts "$RUNNER_TEMP/stale.json" $flag > "$RUNNER_TEMP/stale.md"
          cat "$RUNNER_TEMP/stale.md" >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, found by its hidden marker and updated in place.
      - name: Post the stale docs comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.body | startswith("<!-- saasaloy-docs-stale -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/stale.md" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/stale.md" > /dev/null
          fi

      - run: pnpm --filter @saasaloy/web test

      - run: pnpm --filter @saasaloy/web build

      # One browser for both gates: the scripts hand Playwright's Chromium to lhci too.
      - run: pnpm --filter @saasaloy/web exec playwright install --with-deps chromium

      - run: pnpm --filter @saasaloy/web gate:a11y

      - run: pnpm --filter @saasaloy/web gate:lighthouse
